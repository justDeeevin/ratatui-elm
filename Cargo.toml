[package]
name = "ratatui-elm"
version = "2.0.0"
edition = "2024"
authors = ["Devin Droddy <devin@justdeeevin.dev>"]
license = "MIT"
repository = "https://github.com/justdeeevin/ratatui-elm"
description = "A simple Elm architecture framework for ratatui"
readme = "README.md"
keywords = ["tui", "elm", "framework", "ratatui"]
categories = ["command-line-interface", "asynchronous"]

[dependencies]
ratatui-core = "0.1.2"
futures = { version = "0.3.34", default-features = false, features = [
  "async-await",
  "std",
] }
cfg-if = "1.0.4"
byor = { version = "1.0.0", default-features = false, features = [
  "channel",
  "exec",
] }

ratatui = { version = "0.30.2", default-features = false, optional = true, features = [
  "crossterm",
] }
crossterm = { version = "0.29.0", optional = true, features = ["event-stream"] }

ratatui-termion = { version = "0.1.2", optional = true }
termion = { version = "4.0.6", optional = true }
async-signal = { version = "0.2.14", optional = true }
async-stream = { version = "0.3.6", optional = true }

ratatui-termwiz = { version = "0.1.2", optional = true }
termwiz = { version = "0.23.3", optional = true }

[dev-dependencies]
ratatui-widgets = "0.3.2"

[features]
default = ["crossterm", "tokio"]

crossterm = ["dep:ratatui", "dep:crossterm"]
termion = [
  "dep:ratatui-termion",
  "dep:termion",
  "dep:async-signal",
  "dep:async-stream",
]
termwiz = ["dep:ratatui-termwiz", "dep:termwiz"]

tokio = ["byor/tokio"]
smol = ["byor/smol"]
futures = ["byor/futures"]
